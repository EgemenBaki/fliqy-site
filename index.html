<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fliqy — the news, one card at a time</title>
    <meta
      name="description"
      content="Fliqy turns the day into a deck of cards: one headline, one line of context, one link to the publisher. Coming soon to iOS and Android."
    />
    <meta name="theme-color" content="#0B0A09" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" href="icon.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fliqy.app/" />
    <meta property="og:title" content="Fliqy — the news, one card at a time" />
    <meta
      property="og:description"
      content="One headline, one line of context, one link to the publisher. Coming soon to iOS and Android."
    />
    <meta property="og:image" content="https://fliqy.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://fliqy.app/og.png" />

    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0a09;
        --cream: #f2efea;
        --dim: #a49e95;
        --faint: #6b655c;
        --line: #2a2724;
        --amber: #e0a03c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100svh;
        display: grid;
        grid-template-rows: 1fr auto;
        background:
          radial-gradient(60% 50% at 50% 28%, rgba(224, 160, 60, 0.14), transparent 70%),
          var(--bg);
        color: var(--cream);
        font-family:
          ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 56px 24px 32px;
        gap: 0;
      }

      .mark {
        width: 104px;
        height: 104px;
        display: block;
        filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.55));
      }

      h1 {
        margin: 22px 0 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(44px, 9vw, 64px);
        font-weight: 700;
        letter-spacing: -1.2px;
        line-height: 1;
      }

      .tagline {
        margin: 18px 0 0;
        max-width: 30ch;
        font-size: clamp(16px, 2.4vw, 20px);
        line-height: 1.5;
        color: var(--dim);
      }

      .status {
        margin: 34px 0 0;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 11px 18px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(18, 17, 16, 0.72);
        color: var(--cream);
        font-size: 13px;
        letter-spacing: 0.1px;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--amber);
        box-shadow: 0 0 0 0 rgba(224, 160, 60, 0.5);
        animation: pulse 2.4s ease-out infinite;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(224, 160, 60, 0.45);
        }
        70% {
          box-shadow: 0 0 0 10px rgba(224, 160, 60, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(224, 160, 60, 0);
        }
      }

      .langs {
        margin: 30px 0 0;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .langs button {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--faint);
        font: inherit;
        font-size: 11.5px;
        letter-spacing: 0.6px;
        padding: 8px 9px;
        border-radius: 8px;
        cursor: pointer;
      }

      .langs button:hover {
        color: var(--dim);
      }

      .langs button[aria-pressed="true"] {
        color: var(--cream);
      }

      footer {
        padding: 28px 24px 34px;
        text-align: center;
        display: grid;
        gap: 10px;
      }

      .countries {
        margin: 0;
        font-size: 11.5px;
        line-height: 1.9;
        letter-spacing: 0.2px;
        color: var(--faint);
      }

      .copy {
        margin: 0;
        font-size: 11.5px;
        color: #45403a;
      }

      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="mark.png" alt="" width="104" height="104" />
      <h1>Fliqy</h1>
      <p class="tagline" data-i18n="tagline">The news, one card at a time.</p>

      <p class="status">
        <span class="dot" aria-hidden="true"></span>
        <span data-i18n="status">Coming soon to iOS and Android.</span>
      </p>

      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="tr" aria-pressed="false">TR</button>
        <button type="button" data-lang="es" aria-pressed="false">ES</button>
        <button type="button" data-lang="pt" aria-pressed="false">PT</button>
      </div>
    </main>

    <footer>
      <p class="countries">
        Türkiye · United States · United Kingdom · Ireland · Canada · Australia · New Zealand ·
        España · Brasil
      </p>
      <p class="copy">© 2026 Fliqy</p>
    </footer>

    <script>
      const COPY = {
        en: {
          tagline: 'The news, one card at a time.',
          status: 'Coming soon to iOS and Android.',
        },
        tr: {
          tagline: 'Haberler, tek kartta.',
          status: 'Yakında iOS ve Android’de.',
        },
        es: {
          tagline: 'La actualidad, una tarjeta a la vez.',
          status: 'Muy pronto en iOS y Android.',
        },
        pt: {
          tagline: 'As notícias, um cartão por vez.',
          status: 'Em breve no iOS e Android.',
        },
      };

      const supported = Object.keys(COPY);
      const buttons = Array.from(document.querySelectorAll('[data-lang]'));

      function apply(lang) {
        const dict = COPY[lang] || COPY.en;
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach((node) => {
          const key = node.getAttribute('data-i18n');
          if (dict[key]) node.textContent = dict[key];
        });
        buttons.forEach((button) => {
          button.setAttribute('aria-pressed', String(button.dataset.lang === lang));
        });
      }

      buttons.forEach((button) => {
        button.addEventListener('click', () => apply(button.dataset.lang));
      });

      const preferred = (navigator.language || 'en').slice(0, 2).toLowerCase();
      apply(supported.includes(preferred) ? preferred : 'en');
    </script>
  </body>
</html>
