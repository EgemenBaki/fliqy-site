<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Fliqy</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0B0A09" />
    <link rel="icon" href="/icon.png" sizes="64x64" type="image/png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0a09;
        --cream: #f2efea;
        --dim: #a49e95;
        --faint: #6b655c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(60% 50% at 50% 30%, rgba(224, 160, 60, 0.12), transparent 70%),
          var(--bg);
        color: var(--cream);
        font-family:
          ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 20px 0 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(32px, 7vw, 44px);
        letter-spacing: -0.8px;
      }
      p {
        margin: 12px 0 0;
        color: var(--dim);
        font-size: 14.5px;
      }
      a {
        display: inline-block;
        margin-top: 26px;
        padding: 12px 20px;
        border-radius: 999px;
        background: var(--cream);
        color: var(--bg);
        font-size: 13.5px;
        font-weight: 600;
        text-decoration: none;
      }
      .code {
        margin-top: 22px;
        font-size: 11.5px;
        letter-spacing: 0.8px;
        color: var(--faint);
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/mark.png" alt="" width="72" height="72" />
      <h1>This page doesn’t exist</h1>
      <p>The link may be old, or the address may be mistyped.</p>
      <a href="/">Back to Fliqy</a>
      <p class="code">404</p>
    </main>
  </body>
</html>
